      env-var key map; model catalog + unknown-model warning; validated
      llm_max_retries/max_tokens coercion
  - id: llm.openai_compatible
    status: ACTIVE_PRODUCTION
    modules: [tradingagents/llm_clients/openai_client.py,
      tradingagents/llm_clients/capabilities.py]
    purpose: normalized content; per-model capability table (tool_choice
      suppression, json modes, reasoning_content roundtrip, reasoning_split);
      Responses API only on native api.openai.com; key-optional local servers;
      reasoning_effort gated to reasoning models
  - id: llm.native_providers
    status: UNUSED
    modules: [tradingagents/llm_clients/anthropic_client.py,
      tradingagents/llm_clients/google_client.py,
      tradingagents/llm_clients/azure_client.py,
      tradingagents/llm_clients/bedrock_client.py]
    purpose: native Anthropic/Gemini/Azure/Bedrock clients; not used by ALPHA
      (bridge is openai_compatible) but production code for other users

  # ================= Supporting / entry points =================
  - id: cli.interactive_app
    status: ACTIVE_PARTIAL
    modules: [cli/main.py, cli/run.py, cli/prompts.py, cli/selections.py,
      cli/display.py, cli/stats_handler.py, cli/announcements.py, cli/prefs.py,
      cli/models.py, cli/config.py]
    purpose: Typer interactive TUI (provider/model pickers, streaming display,
      stats); NOT on ALPHA's path (ALPHA calls the graph directly via run_ta.py)
  - id: entrypoint.demo_main
    status: UNUSED
    modules: [main.py]
    purpose: upstream demo script (propagates NVDA); not part of ALPHA pipeline
  # ================= Operator tooling =================
  - id: ops.command_center_dashboard
    status: ACTIVE_PRODUCTION
    modules: [dashboard/server.py, dashboard/config.py, dashboard/paths.py,
      dashboard/readutil.py, dashboard/truth_ledger.py,
      dashboard/adapters/alpha.py, dashboard/adapters/c12.py,
      dashboard/adapters/capabilities.py, dashboard/adapters/health.py,
      dashboard/adapters/providers.py, dashboard/static/index.html,
      dashboard/static/app.js, dashboard/static/styles.css]
    purpose: read-only local web dashboard (127.0.0.1:8420) over ALPHA/C12
      authoritative state — overview, opportunity funnel, TA research,
      positions + Phase-G entry snapshots, deterministic/adaptive management,
      executions, performance/evidence, provider + system health, capability
      registry, track boundaries. Safe controls are an allowlist wrapping
      ops.ta (health/status/backup); no economic write path exists.
    authority: none — reads the state files listed in state_authority; own
      truth ledger at dashboard/truth_ledger.py
    limitations: [localhost only; polling refresh; controls are read-only
      or archive-writing; never exposes secrets; not a trading interface]
    docs: docs/TRADINGAGENTS_DASHBOARD.md
    tests: dashboard/tests/
duplicated_implementations:
  - capability: portfolio_simulation
    authoritative: monitor_state.json + do_exit (alpha_rnd/monitor.py)
    non_authoritative: [mgmt_time_machine.py, replay.py, r5b_report.py,
      tradingagents/backtest.py, ta_eval_alpha/e17_screener.py]
  - capability: exit_execution
    authoritative: pending_open_exits + resolve_pending (monitor.py)
    non_authoritative: [mgmt_time_machine treatment fills]
  - capability: trigger_evaluation
    authoritative: mgmt.py::evaluate + monitor.py close/intraday passes
    non_authoritative: [mgmt_time_machine.py replay copies]
  - capability: discovery_scoring
    authoritative: e17_screener.py via discovery.py
    non_authoritative: [low_price_shadow.py reuses e17 on shadow population only]
  - capability: watchlist_spec
    authoritative: live_watchlist.json (gen_watchlist spec + publish merge)
    non_authoritative: [case_artifact trigger text, funnel monitor projections]
  - capability: vendored_library_copy
    authoritative: TradingAgents-alpha-rnd/tradingagents (imported by ALPHA)
    non_authoritative: [TradingAgents-tracks/tradingagents mirror copy,
      TradingAgents-c12 frozen v0.5.0 tree]
state_authority:
  cash: monitor_state.json (AUTHORITATIVE)
  positions: monitor_state.json (AUTHORITATIVE)
  pending_orders: monitor_state.json pending_open_fills/exits (AUTHORITATIVE)
  executed_fill_ids: monitor_state.json executed[] (AUTHORITATIVE = fill only)
  mgmt_actions: management_actions.json (AUTHORITATIVE for adaptive lifecycle)
  entry_snapshots: entry_snapshots/ (AUTHORITATIVE, immutable)
  intents: management_intents/ (AUTHORITATIVE validated decisions)
  publication_intents: publication_intents_<session>.json (AUTHORITATIVE frozen
    dispositions, append-only)
  watchlist: live_watchlist.json (AUTHORITATIVE for watches/stops)
  watch_lifecycle: monitor_state.json watch_lifecycle (AUTHORITATIVE terminal/
    superseded markers)
  funnel: opportunity_funnel/<session>.json (AUTHORITATIVE ex-ante, immutable)
  cohort_outcomes: rank_cohort_outcomes*/ (AUTHORITATIVE ex-post, append-only)
  memory_log: trading_memory.md (AUTHORITATIVE decision/reflection log)
  management_state: management_state.json (OBSERVABILITY_ONLY)
  management_requests: management_requests/ (OBSERVABILITY_ONLY)
  mevents/ledger: alpha_paper_ledger.jsonl + trigger_events.jsonl + management_
    events.jsonl (EVIDENCE)
  scheduler_state: scheduler_state.json (OPS STATE incl. published_sessions)
  bridge_journal: systemd journal of tradingagents-swe-bridge.service (EVIDENCE)
track_boundaries:
  ALPHA_RND:
    worktree: TradingAgents-alpha-rnd
    branch: exp/alpha-rnd-v1
    type: OPPORTUNITY_RND paper-only
    economic_authority: monitor_state.json
    may_mutate_production: "its own state only"
    outputs: paper evidence
  C12_PROSPECTIVE:
    worktree: TradingAgents-c12
    branch: exp/gate-c12-prospective
    type: VALIDATION_CONTROL frozen v0.5.0
    economic_authority: own ledger
    may_mutate_production: "no (other tracks MUST NOT touch)"
    outputs: clean validation evidence
  EXPERT_RND:
    worktree: TradingAgents-expert-rnd
    type: ANALYSIS_RND
    may_mutate_production: "no"
    outputs: signal evidence only
  TIME_MACHINE_RND:
    worktree: TradingAgents-time-machine-rnd
    type: RESEARCH (broad time-machine)
    may_mutate_production: "no"
    outputs: simulation only
  TRACKS_REPO:
    path: TradingAgents-tracks
    type: DOCS/REGISTRY hub
    note: vendored TA copy here is a mirror, not the imported one
provider_semantics:
  yfinance:
    pit: "OHLCV yes (as_of filter + stale reject); profile/insider/statements TODAY_ONLY-withheld; news window-trimmed recent-only"
    retry: "429 x3 exponential backoff"
    fail_visibility: sentinels visible to model
  sec_edgar:
    pit: "yes (filed-date true PIT)"
    coverage: "US filers only"
    fail_visibility: "NoMarketData falls through to next vendor"
  fred:
    pit: "yes (vintage-pinned realtime bounds)"
    key: FRED_API_KEY
    absent_key: "optional-category sentinel"
    fail_visibility: visible
  polymarket:
    pit: "no (TODAY_ONLY, withheld on historical)"
    key: none
    fail_visibility: "sentinel visible"
  reddit:
    pit: "partial (window-trimmed, ~7d reach, coverage_gap honesty)"
    key: none
    retry: "one 429 retry honoring Retry-After else ~60s jittered"
    fail_visibility: placeholder
  stocktwits:
    pit: "partial (same as reddit)"
    key: none
    retry: none
    fail_visibility: placeholder
  alpha_vantage:
    pit: "same withhold rules via shared guards"
    key: ALPHA_VANTAGE_API_KEY
    status: configured-but-unused-by-ALPHA
  typesafe_jev:
    key: "TYPESAFE_API_KEY (absent = screening off)"
    fail_visibility: "unscreened note; stance thresholds 0.3/0.5"
  swe_bridge:
    provider: "openai_compatible @127.0.0.1:8765/v1"
    models: "[devin-quick=swe-2-medium, devin-deep=swe-2-high]"
    temp: "0"
    fail_visibility: "error artifacts + infra_status reason codes"
limits: >
  Social feeds (Reddit/StockTwits/Yahoo news) are window-trimmed but serve only
  recent items, so historical sentiment is coverage-bounded, not full-PIT.
  yfinance profile/insider/statements are TODAY_ONLY and withheld on historical
  runs. SEC EDGAR is the only true-PIT fundamentals source; ALPHA pins
  statements to it. Prediction markets are TODAY_ONLY. The tracks-repo
  tradingagents/ tree is a mirror; ALPHA imports the alpha-rnd copy.
