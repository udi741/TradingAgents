# TradingAgents Capability Registry — canonical machine-readable map.
# Status vocabulary: ACTIVE_PRODUCTION | ACTIVE_PARTIAL | SHADOW_ONLY |
#   RESEARCH_ONLY | LEGACY | DUPLICATED | BROKEN | UNUSED | MISSING
# RULE: no production capability is complete until this registry,
# TRADINGAGENTS_CAPABILITY_REFERENCE.md, and the system guide are updated.
# Module paths are relative to the ALPHA worktree root
# (/home/udi/udi_provate/TradingAgents-alpha-rnd); tracks/ paths are relative
# to this repo. tradingagents/ = the vendored library ALPHA actually imports.
registry_version: 2
generated_from: code audit of alpha_rnd/, evaluations/alpha_rnd_v1/,
  tradingagents/ (vendored), cli/, ta_eval_alpha/, tracks repo
capabilities:
  # ================= ALPHA operating layer =================
  - id: discovery.universe
    status: ACTIVE_PRODUCTION
    modules: [evaluations/alpha_rnd_v1/discovery.py, ta_eval_alpha/e17_screener.py]
    purpose: PIT universe (Wikipedia S&P500/MidCap400 + nasdaqtrader common stock),
      junk-name filter, eligibility (>=252 sessions, close>=$5, medDV20>=$20M),
      multi-lane scoring (momentum/RS/quality-pullback/catalyst/fundamental-
      acceleration), frozen candidate pool
    authority: candidate_pool_frozen_<session>.json, universe_raw.json,
      market_cache_<session>.pkl
    limitations: [no LLM; fail-soft on universe fetch errors;
      deep_quota=10 must match daily_scheduler]
  - id: discovery.ta_analysis
    status: ACTIVE_PRODUCTION
    modules: [evaluations/alpha_rnd_v1/run_ta.py]
    purpose: per-ticker full TradingAgents graph run via SWE bridge
      (devin-quick=swe-2-medium, devin-deep=swe-2-high, temperature=0,
      statements pinned to sec_edgar, flat PortfolioContext $100k)
    authority: case_artifacts/<T>_<session>.json (sha-stamped),
      <T>_<session>.error.json for failures
    limitations: [~25 calls/ticker; pretrained model knowledge;
      artifact caching makes reruns read-only]
  - id: discovery.retry
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/daily_scheduler.py]
    purpose: bounded fair retry of failed TA (7-day lifetime, <=2/run,
      least-recently-attempted first); skips LLM call when upstream known-down
  - id: entry.synthesize
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/synthesize.py]
    purpose: bridge translator converts TA text -> machine intents; numbers must
      appear in source text; TranslatorInfra on infra failure; deterministic
      fail-closed disposition per ticker
    authority: publication_intents_<session>.json (append-only merge; never
      drops prior intents)
    notes: >-
      8 dispositions: EXECUTABLE_WATCH, REANALYZE_ON_TRIGGER,
      RISK_PLAN_REQUIRED, RESEARCH_ONLY, AMBIGUOUS_REJECTED, NO_ACTION,
      OPEN_POSITION_MANAGEMENT, PUBLISHED_NON_EXECUTABLE. Publishable set =
      EXECUTABLE_WATCH, REANALYZE_ON_TRIGGER, PUBLISHED_NON_EXECUTABLE.
      Machine-executable requires watch_mode in {AUTO_ENTRY,
      DETERMINISTIC_CONFIRMATION} + an executable param key + a risk plan.
  - id: entry.gate
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/entry_gate.py, alpha_rnd/monitor.py]
    purpose: >-
      fail-closed entry authorization: latest frozen publication for the
      ticker must be EXECUTABLE_WATCH AND the watch's revision session must equal
      that latest session; REANALYZE_ON_TRIGGER never passes
  - id: entry.success_plan
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/success_plan.py, alpha_rnd/monitor.py]
    purpose: every executable buy must define base/bull value ranges (legacy
      `target` doubles as base-case top), success_criteria,
      profit_realization_plan; optional policy minimums
      (management_policy.success_plan.min_upside_pct / min_rr); fail-closed
      in do_fill. Long-only validation; shorts untested.
    limitations: [legacy target fallback; long-oriented]
  - id: entry.triggers
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/monitor.py]
    purpose: >-
      monitor primitives evaluated on daily/intraday bars:
      multi_close_in_zone, close_in_zone_low_vol, close_in_zone (zone2),
      close_breakout_vol, close_breakout_retest, orderly_pullback_close,
      weekly_close_breakout (Fridays), reclaim_2step, gapfill_probe,
      event_gated_multi_close, close_breakout, intraday_zone_touch
      (DETERMINISTIC_CONFIRMATION only). Malformed watch params reject at eval.
  - id: entry.publish
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/publish.py, alpha_rnd/gen_watchlist.py]
    purpose: >-
      atomic live_watchlist.json regen: hand-curated WATCHES/POSITIONS
      spec merged with published EXECUTABLE_WATCH/REANALYZE_ON_TRIGGER intents
      from all sessions <= publish session; newer revision wins per ticker;
      monitor_state.watch_lifecycle terminal/revised watches never resurrect;
      publication marker recorded in scheduler_state.published_sessions
    authority: alpha_rnd/live_watchlist.json (AUTHORITATIVE watches/stops)
  - id: economics.monitor_state
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/monitor.py]
    purpose: canonical cash/positions/pending_open_fills/pending_open_exits/
      executed/outbox; executed[] capped to last 2000 exec ids
    authority: alpha_rnd/monitor_state.json
  - id: economics.fills
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/monitor.py]
    purpose: next-open fills; pro-rata cost basis incl. 0.1% fee; exec-id dedup;
      executed[] = fill authority only; do_exit removes matching
      pending_open_exits; resolve_pending fills pending orders at next open
  - id: mgmt.deterministic
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/monitor.py]
    purpose: hard intraday stops + close_below/close rules -> next-open exits;
      always runs before and independent of any inference
  - id: mgmt.snapshots
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/mgmt.py]
    purpose: immutable entry snapshot incl. frozen success_plan + original stop
      (R basis); backfill_missing for legacy positions
    authority: evaluations/alpha_rnd_v1/entry_snapshots/
  - id: mgmt.triggers
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/mgmt.py]
    purpose: >-
      R-based triggers vs frozen entry risk unit (1R = (entry - original stop)/entry): APPRECIATION >=1.0R, PEAK_GIVEBACK (peak>=1R and >=50% giveback), ADVERSE_ACCELERATION <=-1.25R, HORIZON_REVIEW at parsed reeval date; R_CONTEXT_UNAVAILABLE suppresses price triggers; edge-trigger + 2-session cooldown + 20%-of-threshold hysteresis; catalyst schema-reserved/disabled. Trigger = request to think again.
    authority: alpha_rnd/management_policy.json (trigger config)
  - id: mgmt.reassessment
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/mgmt_reassess.py]
    purpose: frozen per-trigger context (bars window, SEC catalysts, position
      fingerprint) -> bridge inference -> management_analyses/; position-state
      fingerprint staleness (STALE_POSITION_CLOSED/CHANGED); urgent families
      (ADVERSE_ACCELERATION) prioritized
    limitations: [HISTORICAL_RESEARCH_EVIDENCE only when replayed]
  - id: mgmt.validator
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/mgmt_validate.py, alpha_rnd/success_plan.py]
    purpose: never-widen stop check, partial-exit normalization, composite stop,
      runner contract (remaining thesis + revised objective + positive
      remaining upside required to HOLD a realized objective), stale/superseded
    authority: management_intents/
  - id: mgmt.execution
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/mgmt_exec.py]
    purpose: VALID intent -> management_actions.json lifecycle
      ENQUEUED/ALREADY_ENQUEUED -> canonical pending exit -> next-open fill;
      revalidation against live state; remainder-rule checks; kill switch
      management_policy.execution.enabled cancels unfilled adaptive orders,
      never reverses fills. ENQUEUED != FILLED; executed[] stays fill-only.
    authority: management_actions.json; switch=management_policy.json
      execution.enabled
    current_state: ENABLED (paper, since 2026-10-16)
  - id: mgmt.runner_contract
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/success_plan.py]
    purpose: no runner/HOLD on realized objective without remaining thesis +
      revised objective + positive remaining upside
  - id: ops.scheduler
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/daily_scheduler.py]
    purpose: >-
      cron lifecycle: sched lock + cycle lock, per-stage subprocess
      timeouts, state txns (flock + atomic), urgent-mgmt pre-pass, upstream-
      known-down skip before spending model calls, INTERRUPTED honestly
      overwritten by later success
  - id: ops.infra_status
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/infra_status.py]
    purpose: bridge-process health (systemd + /v1/models probe) vs upstream
      model status from journal evidence only; reason codes
      (MODEL_RATE_LIMITED/QUOTA_EXHAUSTED/UNAVAILABLE/TIMEOUT/BRIDGE_FAILURE/
      TA_RUNTIME_FAILURE/MALFORMED_MODEL_OUTPUT/UNKNOWN), retryable flags,
      analysis_summary terminal model; no model calls
  - id: ops.notify
    status: ACTIVE_PRODUCTION
    modules: [alpha_rnd/monitor.py, ops/telegram_relay.py]
    purpose: >-
      event delivery: monitor notify() appends NOTIFICATIONS.log + libnotify
      desktop popup (DISPLAY/DBUS set for cron); ops/telegram_relay.py (tracks
      repo, tradingagents-telegram.service) tails event streams, severity
      routing, semantic dedup by transition identity, circuit breaker;
      delivery != proof
  - id: ops.bridge
    status: ACTIVE_PRODUCTION
    modules: [tradingagents-swe-bridge.service]
    purpose: model provider abstraction at 127.0.0.1:8765/v1 (openai_compatible
      provider); journal = call evidence consumed by infra_status
  - id: profit.legacy_target
    status: LEGACY
    modules: [alpha_rnd/success_plan.py]
    purpose: single-number `target` preserved; becomes base-case top when no
      explicit range exists
  - id: disposition.open_position_management
    status: UNUSED
    modules: [alpha_rnd/synthesize.py]
    purpose: entry-side label for held-ticker validation failures; nothing
      consumes it (ta_outcomes reads it observationally)

